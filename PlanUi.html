<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan</title>
<style>
:root {
  --bg: #000000; --s1: #0c0d10; --s2: #15171b; --s3: #24272e;
  --ink: #f3f4f6; --text2: #c9ccd3; --soft: #9a9fa9; --faint: #7a7f89;
  --ice: #a9d8ff; --err: #ffb4a8; --ok: #8fe0cc; --warn: #f3c98b;
  --ease: cubic-bezier(.23, 1, .32, 1);
  --face: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --disp: "Segoe UI Variable Display", "Segoe UI Light", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--ink); font: 400 14px/1.45 var(--face); -webkit-font-smoothing: antialiased; overflow: hidden; caret-color: var(--ice); user-select: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; user-select: text; }
::selection { background: var(--ice); color: #000; }
:focus-visible { outline: 2px solid var(--ice); outline-offset: 2px; border-radius: 6px; }
::-webkit-scrollbar { width: 12px; height: 12px; }
::-webkit-scrollbar-thumb { background: var(--s3); border-radius: 12px; border: 3px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: #343841; }
::-webkit-scrollbar-corner { background: transparent; }

#app { display: grid; grid-template-columns: 236px minmax(0, 1fr); height: 100vh; }

/* ---------- sidebar */
#side { display: flex; flex-direction: column; padding: 22px 14px 14px; border-right: 1px solid var(--s2); background: var(--bg); min-height: 0; }
.brand { display: flex; align-items: center; gap: 12px; padding: 0 10px 22px; font: 600 15px var(--face); letter-spacing: .01em; }
.brand svg { width: 15px; height: 24px; fill: var(--ice); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 12px; height: 38px; padding: 0 12px; border-radius: 999px; color: var(--soft); text-align: left; transition: background .18s var(--ease), color .18s var(--ease); }
.nav button svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.nav button:hover { background: var(--s1); color: var(--ink); }
.nav button.on { background: var(--s2); color: var(--ink); }
.nav button .n { margin-left: auto; font-size: 12px; color: var(--faint); }
.nav button .n.hot { color: var(--err); }
.cap { padding: 22px 12px 8px; font: 600 10.5px var(--face); letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }
.lists { overflow: auto; min-height: 0; flex: 1 1 auto; }
.lists button { width: 100%; }
.lists .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; margin: 0 4px; }
.lists .none { padding: 4px 12px; color: var(--faint); font-size: 12.5px; line-height: 1.5; }
.g { margin-top: 12px; padding: 14px; border-radius: 18px; background: var(--s1); border: 1px solid var(--s2); }
.g .row { display: flex; align-items: center; gap: 9px; font-size: 12.5px; color: var(--soft); }
.g .led { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
.g .led.ok { background: var(--ok); } .g .led.busy { background: var(--ice); animation: pulse 1s infinite; } .g .led.bad { background: var(--err); }
.g .acts { display: flex; gap: 8px; margin-top: 12px; }
.g .hint { margin-top: 8px; font-size: 12px; color: var(--faint); line-height: 1.45; }
@keyframes pulse { 50% { opacity: .3; } }

/* ---------- main */
main { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: radial-gradient(900px 240px at 50% -150px, rgba(43, 74, 122, .34), transparent 70%), var(--bg); }
#top { display: flex; align-items: center; gap: 14px; padding: 22px 32px 0; min-height: 66px; flex: none; }
#top h2, .hero h1 { transform: translateZ(0); }
#top h2 { font: 300 30px/1.1 var(--disp); letter-spacing: -.01em; }
#top h2 em { font-style: normal; color: var(--soft); }
#top .sp { flex: 1; }
.seg { display: inline-flex; background: var(--s1); border: 1px solid var(--s2); border-radius: 999px; padding: 3px; }
.seg button { height: 28px; padding: 0 14px; border-radius: 999px; color: var(--soft); font-size: 13px; transition: background .18s var(--ease), color .18s var(--ease); }
.seg button:hover { color: var(--ink); }
.seg button.on { background: var(--s3); color: var(--ink); }
.pill { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 34px; padding: 0 16px; border-radius: 999px; background: var(--s2); color: var(--ink); font-weight: 600; font-size: 13px; white-space: nowrap; transition: background .18s var(--ease), transform .12s var(--ease); }
.pill:hover { background: var(--s3); } .pill:active { transform: scale(.97); }
.pill.primary { background: var(--ink); color: #000; } .pill.primary:hover { background: #d3d5da; }
.pill.ghost { background: transparent; color: var(--soft); } .pill.ghost:hover { background: var(--s2); color: var(--ink); }
.pill.danger { background: transparent; color: var(--soft); } .pill.danger:hover { background: var(--s2); color: var(--err); }
.pill.sm { height: 30px; padding: 0 13px; font-size: 12.5px; }
.pill svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
.icon { width: 34px; height: 34px; border-radius: 50%; display: inline-grid; place-items: center; color: var(--soft); transition: background .18s var(--ease), color .18s var(--ease); }
.icon:hover { background: var(--s2); color: var(--ink); }
.icon svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* quick add */
#qa { padding: 16px 32px 0; flex: none; }
.qbox { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 8px 0 18px; border-radius: 999px; background: var(--s2); border: 1px solid transparent; transition: border-color .18s var(--ease), background .18s var(--ease); }
.qbox:focus-within { border-color: var(--ice); background: var(--s1); }
.qbox svg { width: 16px; height: 16px; stroke: var(--faint); fill: none; stroke-width: 2; stroke-linecap: round; flex: none; }
.qbox input { flex: 1; min-width: 0; height: 100%; background: transparent; border: 0; outline: 0; font-size: 14.5px; }
.qbox input::placeholder { color: var(--faint); }
.qbox .seg { padding: 2px; } .qbox .seg button { height: 26px; padding: 0 11px; font-size: 12px; }
.qprev { display: flex; flex-wrap: wrap; gap: 7px; min-height: 30px; padding: 9px 4px 0 18px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 11px; border-radius: 999px; background: var(--s2); color: var(--text2); font-size: 12px; white-space: nowrap; }
.chip.k { background: color-mix(in srgb, var(--ice) 16%, var(--s1)); color: var(--ice); }
.chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.qprev .help { color: var(--faint); font-size: 12px; }

#view { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 20px 32px 32px; position: relative; }
#view.flush { overflow: hidden; display: flex; flex-direction: column; padding-bottom: 20px; }

/* ---------- lists & rows */
.h { display: flex; align-items: baseline; gap: 10px; margin: 22px 0 8px; font: 600 10.5px var(--face); letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }
.h:first-child { margin-top: 0; }
.h b { font-weight: 600; color: var(--soft); letter-spacing: .02em; text-transform: none; font-size: 12px; }
.h.err { color: var(--err); }
.row { position: relative; display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 6px 10px 6px 8px; margin: 0 -8px; border-radius: 14px; cursor: pointer; transition: background .15s var(--ease); }
.row:hover { background: var(--s1); }
.row .t { flex: 1 0 110px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .m { flex: 0 1 auto; min-width: 0; overflow: hidden; display: flex; align-items: center; gap: 8px; color: var(--faint); font-size: 12.5px; white-space: nowrap; }
.row .m .late { color: var(--err); }
.row.done .t { color: var(--faint); text-decoration: line-through; text-decoration-color: var(--s3); }
.row .x { opacity: 0; width: 26px; height: 26px; border-radius: 50%; color: var(--soft); display: grid; place-items: center; transition: opacity .15s var(--ease), background .15s var(--ease); }
.row .x:hover { background: var(--s3); color: var(--err); }
.row:hover .x { opacity: 1; }
.row .x svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
.ck { width: 20px; height: 20px; border-radius: 50%; border: 1.7px solid var(--pc, var(--s3)); flex: none; display: grid; place-items: center; transition: background .18s var(--ease), border-color .18s var(--ease), transform .12s var(--ease); }
.ck:hover { border-color: var(--ice); background: color-mix(in srgb, var(--ice) 14%, transparent); }
.ck:active { transform: scale(.88); }
.ck svg { width: 11px; height: 11px; stroke: #000; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.done .ck { background: var(--ice); border-color: var(--ice); } .done .ck svg { opacity: 1; }
.tag { display: inline-flex; align-items: center; gap: 6px; }
.tag i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.rp { display: inline-flex; align-items: center; gap: 4px; }
.rp svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.pr { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.pr.p3 { background: var(--err); } .pr.p2 { background: var(--warn); } .pr.p1 { background: var(--faint); }
.empty { color: var(--faint); padding: 8px 0 4px; font-size: 13px; }
.sync-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--faint); opacity: .5; }

/* ---------- today */
.hero { display: flex; align-items: flex-end; gap: 24px; margin-bottom: 6px; }
.hero .k { font: 600 10.5px var(--face); letter-spacing: .16em; text-transform: uppercase; color: var(--faint); margin-bottom: 8px; }
.hero h1 { font: 300 58px/1 var(--disp); letter-spacing: -.025em; }
.hero h1 em { font-style: normal; color: var(--soft); }
.hero .sum { margin-left: auto; text-align: right; color: var(--soft); font-size: 13.5px; line-height: 1.7; padding-bottom: 6px; }
.hero .sum b { color: var(--ink); font-weight: 600; }
.strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin: 22px 0 6px; }
.strip button { display: flex; flex-direction: column; gap: 2px; padding: 11px 13px; border-radius: 16px; background: var(--s1); border: 1px solid var(--s2); text-align: left; transition: background .18s var(--ease), border-color .18s var(--ease), transform .18s var(--ease); }
.strip button:hover { background: var(--s2); border-color: var(--s3); transform: translateY(-1px); }
.strip .d { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
.strip .n { font: 300 24px/1.1 var(--disp); }
.strip .c { font-size: 11.5px; color: var(--soft); min-height: 17px; }
.strip button.today { border-color: color-mix(in srgb, var(--ice) 45%, var(--s2)); }
.strip button.today .d { color: var(--ice); }
.two { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 40px; margin-top: 10px; }
@media (max-width: 1020px) { .two { grid-template-columns: 1fr; gap: 8px; } .hero h1 { font-size: 44px; } .hero .sum { display: none; } .strip .c { display: none; } }
.ev { display: flex; gap: 14px; align-items: stretch; padding: 8px 10px 8px 8px; margin: 0 -8px; border-radius: 14px; cursor: pointer; transition: background .15s var(--ease); }
.ev:hover { background: var(--s1); }
.ev .tm { width: 66px; flex: none; font-size: 12.5px; color: var(--soft); padding-top: 2px; font-variant-numeric: tabular-nums; }
.ev .bar { width: 3px; border-radius: 3px; background: var(--c); flex: none; }
.ev .b { min-width: 0; }
.ev .b .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev .b .s { color: var(--faint); font-size: 12.5px; }
.ev.past { opacity: .5; }
.ev.now .tm { color: var(--ice); }
.nowline { display: flex; align-items: center; gap: 8px; margin: 4px 0; color: var(--ice); font-size: 11px; letter-spacing: .1em; }
.nowline::after { content: ""; flex: 1; height: 1px; background: color-mix(in srgb, var(--ice) 60%, transparent); }

/* ---------- calendar */
.cal { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.month { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-auto-rows: 1fr; flex: 1; min-height: 0; border-top: 1px solid var(--s2); border-left: 1px solid var(--s2); border-radius: 0; }
.dow { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); padding: 6px 0; font: 600 10.5px var(--face); letter-spacing: .14em; text-transform: uppercase; color: var(--faint); flex: none; }
.dow span { padding: 0 10px; }
.cell { position: relative; border-right: 1px solid var(--s2); border-bottom: 1px solid var(--s2); padding: 6px 6px 4px; min-height: 0; overflow: hidden; cursor: pointer; transition: background .15s var(--ease); }
.cell:hover { background: var(--s1); }
.cell.out .dn { color: var(--s3); }
.cell .dn { display: inline-grid; place-items: center; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 999px; font-size: 12.5px; color: var(--text2); }
.cell.today .dn { background: var(--ice); color: #000; font-weight: 600; }
.cell .more { color: var(--faint); font-size: 11.5px; padding: 1px 6px; cursor: pointer; } .cell .more:hover { color: var(--ink); }
.chipev { display: block; margin: 2px 0; height: 20px; line-height: 20px; padding: 0 7px; border-radius: 6px; font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: color-mix(in srgb, var(--c) 17%, var(--s1)); border-left: 2px solid var(--c); color: var(--ink); cursor: pointer; }
.chipev:hover { background: color-mix(in srgb, var(--c) 28%, var(--s1)); }
.chipev.tk { background: transparent; border-left: 0; color: var(--soft); padding-left: 2px; }
.chipev.tk::before { content: "○ "; color: var(--c); }
.chipev.tk.done { text-decoration: line-through; color: var(--faint); }
.chipev .tt { color: var(--soft); margin-right: 5px; }

.tg { display: flex; flex-direction: column; flex: 1; min-height: 0; border-top: 1px solid var(--s2); }
.tg-head { display: grid; grid-template-columns: 54px repeat(var(--n), minmax(0, 1fr)); flex: none; padding-right: 12px; }
.tg-head .c { padding: 10px 8px 8px; border-left: 1px solid var(--s2); cursor: pointer; }
.tg-head .c .d { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }
.tg-head .c .n { font: 300 26px/1.1 var(--disp); }
.tg-head .c.today .d { color: var(--ice); } .tg-head .c.today .n { color: var(--ice); }
.tg-allday { display: grid; grid-template-columns: 54px repeat(var(--n), minmax(0, 1fr)); flex: none; padding-right: 12px; border-bottom: 1px solid var(--s2); }
.tg-allday .l { font-size: 10px; color: var(--faint); letter-spacing: .1em; text-transform: uppercase; padding: 8px 6px 0 0; text-align: right; }
.tg-allday .c { border-left: 1px solid var(--s2); padding: 4px 3px; min-height: 32px; }
.tg-scroll { flex: 1; min-height: 0; overflow-y: auto; position: relative; }
.tg-body { position: relative; display: grid; grid-template-columns: 54px repeat(var(--n), minmax(0, 1fr)); height: calc(24 * var(--hh)); }
.tg-hours { position: relative; }
.tg-hours span { position: absolute; right: 8px; transform: translateY(-50%); font-size: 10.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
.tg-col { position: relative; border-left: 1px solid var(--s2); background-image: linear-gradient(to bottom, var(--s2) 1px, transparent 1px); background-size: 100% var(--hh); }
.tg-col.today { background-color: rgba(169, 216, 255, .025); }
.evb { position: absolute; border-radius: 9px; padding: 4px 8px; overflow: hidden; background: color-mix(in srgb, var(--c) 20%, #0c0d10); border-left: 3px solid var(--c); cursor: grab; font-size: 12px; line-height: 1.3; transition: filter .15s var(--ease); touch-action: none; }
.evb:hover { filter: brightness(1.18); }
.evb .tt { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.evb .ts { color: var(--text2); opacity: .85; font-size: 11px; }
.evb.drag { opacity: .85; cursor: grabbing; z-index: 8; box-shadow: 0 10px 30px rgba(0, 0, 0, .6); }
.evb .rz { position: absolute; left: 0; right: 0; bottom: 0; height: 7px; cursor: ns-resize; }
.dgh { position: absolute; left: 3px; right: 3px; border-radius: 9px; background: color-mix(in srgb, var(--ice) 22%, transparent); border: 1px dashed var(--ice); z-index: 7; pointer-events: none; font-size: 11px; padding: 3px 7px; color: var(--ice); }
.nowl { position: absolute; left: 0; right: 0; height: 0; border-top: 1.5px solid var(--err); z-index: 6; pointer-events: none; }
.nowl::before { content: ""; position: absolute; left: -4px; top: -5px; width: 8px; height: 8px; border-radius: 50%; background: var(--err); }

/* ---------- drawer */
#scrim { position: absolute; inset: 0; background: rgba(0, 0, 0, .5); opacity: 0; pointer-events: none; transition: opacity .22s var(--ease); z-index: 20; }
#scrim.on { opacity: 1; pointer-events: auto; }
#drawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(460px, 100%); background: var(--s1); border-left: 1px solid var(--s2); transform: translateX(104%); transition: transform .28s var(--ease); z-index: 21; display: flex; flex-direction: column; }
#drawer.on { transform: none; }
.dh { display: flex; align-items: center; gap: 10px; padding: 18px 22px 8px; }
.dh .sp { flex: 1; }
.db { flex: 1; overflow: auto; padding: 4px 22px 18px; }
.df { display: flex; align-items: center; gap: 8px; padding: 14px 22px; border-top: 1px solid var(--s2); }
.df .sp { flex: 1; }
.ttl { width: 100%; background: transparent; border: 0; outline: 0; font: 300 28px/1.2 var(--disp); letter-spacing: -.01em; padding: 8px 0 14px; border-bottom: 1px solid var(--s2); margin-bottom: 6px; }
.ttl::placeholder { color: var(--s3); }
.fld { display: flex; align-items: center; gap: 12px; min-height: 48px; border-bottom: 1px solid var(--s2); }
.fld > label { width: 84px; flex: none; color: var(--faint); font-size: 12.5px; }
.fld .v { flex: 1; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.fld.col { flex-direction: column; align-items: stretch; gap: 8px; padding: 12px 0; }
.fld.col > label { width: auto; }
.inp { height: 34px; padding: 0 12px; border-radius: 10px; background: var(--s2); border: 1px solid transparent; outline: 0; min-width: 0; }
.inp:focus { border-color: var(--ice); }
select.inp { padding-right: 8px; cursor: pointer; }
input[type=date].inp, input[type=time].inp { padding: 0 10px; }
input[type=number].inp { width: 64px; }
textarea.inp { height: 92px; padding: 10px 12px; resize: none; line-height: 1.5; width: 100%; }
.days { display: flex; gap: 6px; }
.days button { width: 32px; height: 32px; border-radius: 50%; background: var(--s2); color: var(--soft); font-size: 12px; font-weight: 600; transition: background .15s var(--ease), color .15s var(--ease); }
.days button.on { background: var(--ice); color: #000; }
.prs { display: flex; gap: 6px; }
.prs button { height: 30px; padding: 0 13px; border-radius: 999px; background: var(--s2); color: var(--soft); font-size: 12.5px; }
.prs button.on { background: var(--ink); color: #000; font-weight: 600; }
.sw { position: relative; width: 38px; height: 22px; border-radius: 999px; background: var(--s3); flex: none; transition: background .18s var(--ease); }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--ink); transition: transform .2s var(--ease); }
.sw.on { background: var(--ice); } .sw.on::after { transform: translateX(16px); background: #000; }
.note { color: var(--faint); font-size: 12.5px; padding: 10px 0 0; }
.scope { display: flex; gap: 6px; padding: 12px 0 0; }

#toast { position: absolute; left: 50%; bottom: 26px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; z-index: 40; padding: 0 20px; height: 40px; display: flex; align-items: center; border-radius: 999px; background: var(--ink); color: #000; font-weight: 600; font-size: 13px; transition: opacity .2s var(--ease), transform .25s var(--ease); max-width: 80%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
#toast.err { background: var(--err); }
.fade { animation: fade .28s var(--ease); }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand"><svg viewBox="0 0 324 414"><path fill-rule="evenodd" d="M180 72L252 0V144L144 252L234 342L162 414L0 252L72 180ZM180 252L252 180L324 252V396L252 324Z"/></svg>Plan</div>
    <nav class="nav" id="nav"></nav>
    <div class="cap">Lists</div>
    <div class="lists nav" id="lists"></div>
    <div class="g" id="google"></div>
  </aside>
  <main>
    <header id="top"></header>
    <div id="qa"></div>
    <section id="view"></section>
    <div id="scrim"></div>
    <div id="drawer"></div>
    <div id="toast"></div>
  </main>
</div>

<script>
'use strict';
const HOST = window.chrome && window.chrome.webview;
const post = o => HOST ? HOST.postMessage(JSON.stringify(o)) : mockPost(o);
if (HOST) HOST.addEventListener('message', e => onMsg(e.data));

// ---------------------------------------------------------------- helpers
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const iso = d => `${ymd(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}:00`;
const pd = s => { const [y, m, d] = s.slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d); };
const pdt = s => new Date(s);
const sod = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());

const MON = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const DOW = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const mon0 = d => (d.getDay() + 6) % 7;
const weekStart = d => addDays(sod(d), -mon0(d));
const fmtT = d => { let h = d.getHours(), m = d.getMinutes(); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return m ? `${h}:${pad(m)} ${ap}` : `${h} ${ap}`; };
const hhmm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
function dayWord(d) {
  const t = sod(new Date()), x = sod(d), diff = Math.round((x - t) / 864e5);
  if (diff === 0) return 'Today'; if (diff === 1) return 'Tomorrow'; if (diff === -1) return 'Yesterday';
  if (diff > 1 && diff < 7) return DOW[x.getDay()];
  return `${MON[x.getMonth()].slice(0, 3)} ${x.getDate()}`;
}
const ICON = {
  today: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  cal: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  tasks: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 3 3 5-6"/></svg>',
  up: '<svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
  plus: '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  x: '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  left: '<svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg>',
  right: '<svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg>',
  check: '<svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
  rep: '<svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg>',
  spark: '<svg viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/></svg>',
};

// ---------------------------------------------------------------- state
const S = {
  view: 'today', cal: 'week', anchor: sod(new Date()), cat: null, showTasks: true, showDone: false,
  data: { tasks: [], events: [], cats: [] }, google: { connected: false, status: 'Not connected', hasClient: false },
  kind: 'auto', parsed: null, editor: null, busy: false, dragging: false,
};
let parseTimer = 0, rangeKey = '', lastSig = '', lastGoogleSig = '';

function onMsg(m) {
  if (typeof m === 'string') { try { m = JSON.parse(m); } catch { return; } }
  if (m.type === 'state') {
    // Sync pushes state often; re-rendering identical data made the lists/calendar flash and jump.
    const { google, ...rest } = m, sig = JSON.stringify(rest) + ymd(new Date());
    if (google) { const gs = JSON.stringify(google), gch = gs !== lastGoogleSig; lastGoogleSig = gs; S.google = google; if (gch) renderGoogle(); }
    if (sig === lastSig) return;
    lastSig = sig; S.data = m;
    if (!S.dragging) { renderChrome(); renderView(true); }
  }
  else if (m.type === 'toast') toast(m.text, m.error);
  else if (m.type === 'parsed') { S.parsed = m; renderPreview(); }
  else if (m.type === 'google') { S.google = m; renderGoogle(); }
  else if (m.type === 'nav') { go(m.view || 'today'); }
  else if (m.type === 'focus') { $('#qa input')?.focus(); }
}

function range() {
  const t = sod(new Date());
  if (S.view === 'cal') {
    if (S.cal === 'month') { const f = weekStart(new Date(S.anchor.getFullYear(), S.anchor.getMonth(), 1)); return [f, addDays(f, 42)]; }
    if (S.cal === 'week') { const f = weekStart(S.anchor); return [f, addDays(f, 7)]; }
    return [S.anchor, addDays(S.anchor, 1)];
  }
  return [addDays(t, -7), addDays(t, 45)];
}
function requestRange(force) {
  const [f, t] = range(), key = ymd(f) + ymd(t);
  if (key === rangeKey && !force) return;
  rangeKey = key; lastSig = '';
  post({ cmd: 'range', from: iso(f), to: iso(t) });
}

// ---------------------------------------------------------------- chrome (sidebar, top bar, quick add)
function go(view, extra) {
  if (view === 'month' || view === 'week' || view === 'day') { S.view = 'cal'; S.cal = view; }
  else if (view === 'calendar') { S.view = 'cal'; }
  else S.view = view;
  if (view !== 'tasks' && !(extra && extra.keepCat)) S.cat = view === 'tasks' ? S.cat : null;
  if (S.view === 'cal' && S.anchor < sod(new Date()) - 365 * 864e5) S.anchor = sod(new Date());
  closeEditor();
  requestRange(); renderChrome(); renderView();
}

function counts() {
  const t0 = sod(new Date());
  const open = S.data.tasks.filter(t => !t.done);
  const dueNow = open.filter(t => t.due && pd(t.due) <= t0).length;
  const late = open.filter(t => t.due && pd(t.due) < t0).length;
  return { dueNow, late, open: open.length };
}

function renderChrome() {
  const c = counts();
  const nav = [['today', 'Today', ICON.today, c.dueNow, c.late > 0], ['cal', 'Calendar', ICON.cal, '', false], ['tasks', 'Tasks', ICON.tasks, c.open, false], ['upcoming', 'Upcoming', ICON.up, '', false]];
  $('#nav').innerHTML = nav.map(([k, l, i, n, hot]) => `<button data-act="nav" data-v="${k}" class="${S.view === k && !S.cat ? 'on' : ''}">${i}<span>${l}</span>${n !== '' && n !== 0 ? `<span class="n ${hot ? 'hot' : ''}">${n}</span>` : ''}</button>`).join('');
  $('#lists').innerHTML = S.data.cats.length
    ? S.data.cats.map(k => `<button data-act="cat" data-v="${esc(k.name)}" class="${S.view === 'tasks' && S.cat === k.name ? 'on' : ''}" style="--c:${k.color}"><span class="dot"></span><span>${esc(k.name)}</span>${k.open ? `<span class="n">${k.open}</span>` : ''}</button>`).join('')
    : '<div class="none">Add <b style="color:var(--soft)">#school</b> to anything you type to start a list.</div>';
  renderGoogle(); renderTop(); renderQA();
}

function renderGoogle() {
  const g = S.google;
  const cls = /fail|expired|Missing/i.test(g.status || '') ? 'bad' : /Syncing/.test(g.status || '') ? 'busy' : g.connected ? 'ok' : '';
  $('#google').innerHTML = `<div class="row-g row" style="margin:0;padding:0;min-height:0;cursor:default;background:none"><span class="led ${cls}"></span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${g.connected ? 'Google · ' + esc(g.status.replace(/^Synced /, 'synced ')) : 'Google not connected'}</span></div>`
    + (g.connected
      ? `<div class="acts"><button class="pill sm" data-act="sync">Sync now</button><button class="pill sm ghost" data-act="disconnect">Disconnect</button></div>`
      : `<div class="acts"><button class="pill sm primary" data-act="connect">Connect Google</button></div><div class="hint">${g.hasClient ? 'Sign in to sync with your phone.' : 'Pick the OAuth client file from Google Cloud (see PLANNER.md), then sign in.'}</div>`);
}

function titleFor() {
  const a = S.anchor;
  if (S.view === 'today') return 'Today';
  if (S.view === 'tasks') return S.cat ? `<em>List ·</em> ${esc(S.cat)}` : 'Tasks';
  if (S.view === 'upcoming') return 'Upcoming';
  if (S.cal === 'month') return `${MON[a.getMonth()]} <em>${a.getFullYear()}</em>`;
  if (S.cal === 'week') { const f = weekStart(a), l = addDays(f, 6); return f.getMonth() === l.getMonth() ? `${MON[f.getMonth()]} ${f.getDate()}–${l.getDate()} <em>${l.getFullYear()}</em>` : `${MON[f.getMonth()].slice(0, 3)} ${f.getDate()} – ${MON[l.getMonth()].slice(0, 3)} ${l.getDate()} <em>${l.getFullYear()}</em>`; }
  return `${DOW[a.getDay()]} <em>${MON[a.getMonth()].slice(0, 3)} ${a.getDate()}</em>`;
}

function renderTop() {
  let right = '';
  if (S.view === 'cal') {
    right = `<button class="icon" data-act="prev" title="Previous (←)">${ICON.left}</button><button class="icon" data-act="next" title="Next (→)">${ICON.right}</button><button class="pill sm" data-act="today">Today</button>
      <div class="seg">${['day', 'week', 'month'].map(k => `<button data-act="cal" data-v="${k}" class="${S.cal === k ? 'on' : ''}">${k[0].toUpperCase() + k.slice(1)}</button>`).join('')}</div>
      <button class="pill sm ${S.showTasks ? '' : 'ghost'}" data-act="tasktoggle" title="Show tasks on the calendar">Tasks ${S.showTasks ? '✓' : ''}</button>`;
  }
  if (S.view === 'tasks') right = `<button class="pill sm ${S.showDone ? '' : 'ghost'}" data-act="donetoggle">Completed ${S.showDone ? '✓' : ''}</button>`;
  $('#top').innerHTML = `<h2>${titleFor()}</h2><span class="sp"></span>${right}<button class="pill primary" data-act="new">${ICON.plus}New</button>`;
}

const EXAMPLES = ['dentist every other friday at 3pm', 'lab report friday #school !', 'standup every weekday 9am', 'call mom sunday at 5', 'pay rent monthly on the 1st', 'gym mon wed fri 6pm for 1 hour'];
function renderQA() {
  const el = $('#qa');
  if ($('#qa input') && el.dataset.on) return;       // keep focus while typing
  el.dataset.on = '1';
  el.innerHTML = `<div class="qbox">${ICON.spark}<input id="qin" autocomplete="off" spellcheck="false" placeholder="Add anything…  “${esc(EXAMPLES[Math.floor(Math.random() * EXAMPLES.length)])}”">
    <div class="seg">${[['auto', 'Auto'], ['task', 'Task'], ['event', 'Event']].map(([k, l]) => `<button data-act="kind" data-v="${k}" class="${S.kind === k ? 'on' : ''}">${l}</button>`).join('')}</div></div>
    <div class="qprev" id="qprev"></div>`;
  const inp = $('#qin');
  inp.addEventListener('input', () => { clearTimeout(parseTimer); parseTimer = setTimeout(() => { if (inp.value.trim()) post({ cmd: 'parse', text: inp.value, kind: S.kind }); else { S.parsed = null; renderPreview(); } }, 110); });
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter' && inp.value.trim()) { post({ cmd: 'add', text: inp.value, kind: S.kind }); inp.value = ''; S.parsed = null; renderPreview(); }
    if (e.key === 'Escape') inp.blur();
  });
}
function renderPreview() {
  const el = $('#qprev'); if (!el) return;
  const p = S.parsed, inp = $('#qin');
  if (!p || !inp || !inp.value.trim()) { el.innerHTML = '<span class="help">Dates, times, “every week”, #list and ! for priority are understood.</span>'; return; }
  const bits = [`<span class="chip k">${p.kind === 'event' ? (p.reminder ? 'Reminder' : 'Event') : 'Task'}</span>`, `<span class="chip">${esc(p.title || '…')}</span>`];
  if (p.when) bits.push(`<span class="chip">${esc(p.when)}</span>`);
  if (p.repeat) bits.push(`<span class="chip"><span class="rp">${ICON.rep}${esc(p.repeat)}</span></span>`);
  if (p.cat) bits.push(`<span class="chip" style="--c:${p.color}"><i></i>${esc(p.cat)}</span>`);
  if (p.prio) bits.push(`<span class="chip">${['', 'Low', 'Medium', 'High'][p.prio]} priority</span>`);
  if (p.kind === 'event' && !p.when) bits.push('<span class="chip" style="color:var(--err)">needs a day or time</span>');
  el.innerHTML = bits.join('');
}

// ---------------------------------------------------------------- data helpers
const evStart = e => pdt(e.start), evEnd = e => pdt(e.end);
function eventsOn(day) {
  const a = sod(day), b = addDays(a, 1);
  return S.data.events.filter(e => evStart(e) < b && (evEnd(e) > a || same(evStart(e), a))).sort((x, y) => (y.allDay - x.allDay) || evStart(x) - evStart(y));
}
const openTasks = () => S.data.tasks.filter(t => !t.done);
const tasksOn = day => S.data.tasks.filter(t => t.due && same(pd(t.due), day) && (S.showTasks || S.view !== 'cal'));
function prDot(t) { return t.prio ? `<span class="pr p${t.prio}" title="${['', 'Low', 'Medium', 'High'][t.prio]} priority"></span>` : ''; }
function metaOf(t) {
  const bits = [];
  if (t.due) { const d = pd(t.due), late = !t.done && d < sod(new Date()); bits.push(`<span class="${late ? 'late' : ''}">${late ? 'Overdue · ' : ''}${dayWord(d)}</span>`); }
  if (t.repeat) bits.push(`<span class="rp" title="${esc(t.repeat)}">${ICON.rep}${t.repeat.length > 15 ? '' : esc(t.repeat)}</span>`);
  if (t.cat) bits.push(`<span class="tag" style="--c:${t.color}"><i></i>${esc(t.cat)}</span>`);
  return bits.join('');
}
function taskRow(t) {
  return `<div class="row ${t.done ? 'done' : ''}" data-act="edit-task" data-id="${t.id}" style="--pc:${t.prio === 3 ? 'var(--err)' : t.prio === 2 ? 'var(--warn)' : 'var(--faint)'}">
    <span class="ck" data-act="toggle" data-id="${t.id}">${ICON.check}</span><span class="t">${esc(t.title)}</span><span class="m">${prDot(t)}${metaOf(t)}</span>
    <button class="x" data-act="del-task" data-id="${t.id}" title="Delete">${ICON.x}</button></div>`;
}
function evRow(e, past) {
  const s = evStart(e), en = evEnd(e), now = new Date();
  const cur = !e.allDay && s <= now && en > now;
  const when = e.allDay ? 'All day' : fmtT(s);
  const sub = [e.allDay ? '' : `${fmtT(s)} – ${fmtT(en)}`, e.repeat || '', e.cat || ''].filter(Boolean).join(' · ');
  return `<div class="ev ${past && !cur ? 'past' : ''} ${cur ? 'now' : ''}" data-act="edit-ev" data-id="${e.id}" data-occ="${e.start}" style="--c:${e.color}"><span class="tm">${when}</span><span class="bar"></span><div class="b"><div class="t">${esc(e.title)}</div><div class="s">${esc(sub)}</div></div></div>`;
}

// ---------------------------------------------------------------- views
let lastHtml = '', lastHtmlView = '';
// quiet = a background refresh (sync, clock): skip if nothing changed and don't replay the fade-in, so nothing flashes or jumps.
function renderView(quiet) {
  const v = $('#view');
  v.classList.toggle('flush', S.view === 'cal');
  const html = { today: viewToday, cal: viewCal, tasks: viewTasks, upcoming: viewUpcoming }[S.view]();
  const key = S.view + (S.cat || '') + S.cal;
  if (quiet === true && html === lastHtml && key === lastHtmlView) return;
  lastHtml = html; lastHtmlView = key;
  const prev = v.scrollTop;
  v.innerHTML = quiet ? html.replace(/fade/g, '') : html;
  if (S.view !== 'cal') v.scrollTop = prev;
  if (S.view === 'cal') afterCal();
  $('#qa').style.display = '';
}

function viewToday() {
  const now = new Date(), t0 = sod(now), evs = eventsOn(t0), tmr = eventsOn(addDays(t0, 1));
  const open = openTasks();
  const overdue = open.filter(t => t.due && pd(t.due) < t0), dueToday = open.filter(t => t.due && same(pd(t.due), t0));
  const soon = open.filter(t => t.due && pd(t.due) > t0 && pd(t.due) <= addDays(t0, 7)), later = open.filter(t => !t.due).slice(0, 5);
  const hour = now.getHours(), greet = hour < 5 ? 'Late night' : hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
  const upcomingEv = evs.filter(e => !e.allDay && evStart(e) > now).length;
  const strip = [...Array(7)].map((_, i) => {
    const d = addDays(t0, i), n = eventsOn(d).length, k = open.filter(t => t.due && same(pd(t.due), d)).length;
    const c = [n ? `${n} event${n > 1 ? 's' : ''}` : '', k ? `${k} due` : ''].filter(Boolean).join(' · ');
    return `<button data-act="goday" data-d="${ymd(d)}" class="${i === 0 ? 'today' : ''}"><span class="d">${DOW[d.getDay()].slice(0, 3)}</span><span class="n">${d.getDate()}</span><span class="c">${c || '&nbsp;'}</span></button>`;
  }).join('');
  let sched = '';
  if (!evs.length) sched += '<div class="empty">Nothing on the calendar today.</div>';
  else {
    let placed = false;
    for (const e of evs) {
      if (!placed && !e.allDay && evStart(e) > now) { sched += `<div class="nowline">NOW · ${fmtT(now)}</div>`; placed = true; }
      sched += evRow(e, !e.allDay && evEnd(e) <= now);
    }
    if (!placed && evs.some(e => !e.allDay)) sched += `<div class="nowline">NOW · ${fmtT(now)}</div>`;
  }
  if (tmr.length) sched += `<div class="h">Tomorrow <b>${tmr.length} event${tmr.length > 1 ? 's' : ''}</b></div>` + tmr.slice(0, 4).map(e => evRow(e)).join('');
  let tk = '';
  if (overdue.length) tk += `<div class="h err">Overdue <b>${overdue.length}</b></div>` + overdue.map(taskRow).join('');
  tk += `<div class="h" ${overdue.length ? '' : 'style="margin-top:0"'}>Due today <b>${dueToday.length || ''}</b></div>` + (dueToday.length ? dueToday.map(taskRow).join('') : '<div class="empty">Nothing due today. Nice.</div>');
  if (soon.length) tk += `<div class="h">This week <b>${soon.length}</b></div>` + soon.slice(0, 6).map(taskRow).join('');
  if (later.length && !soon.length) tk += `<div class="h">Someday</div>` + later.map(taskRow).join('');
  return `<div class="fade"><div class="hero"><div><div class="k">${greet}</div><h1>${DOW[now.getDay()]} <em>${MON[now.getMonth()].slice(0, 3)} ${now.getDate()}</em></h1></div>
    <div class="sum"><b>${evs.length}</b> event${evs.length === 1 ? '' : 's'} today${upcomingEv ? ` · ${upcomingEv} still to come` : ''}<br><b>${dueToday.length + overdue.length}</b> task${dueToday.length + overdue.length === 1 ? '' : 's'} need you${overdue.length ? ` · <span style="color:var(--err)">${overdue.length} overdue</span>` : ''}</div></div>
    <div class="strip">${strip}</div>
    <div class="two"><div><div class="h" style="margin-top:20px">Schedule <b>${evs.length || ''}</b></div>${sched}</div><div><div style="height:20px"></div>${tk}</div></div></div>`;
}

function viewTasks() {
  const t0 = sod(new Date());
  let list = S.data.tasks.filter(t => !S.cat || (t.cat || '').toLowerCase() === S.cat.toLowerCase());
  const open = list.filter(t => !t.done), done = list.filter(t => t.done);
  const g = { 'Overdue': [], 'Today': [], 'Tomorrow': [], 'This week': [], 'Later': [], 'No date': [] };
  for (const t of open) {
    if (!t.due) g['No date'].push(t); else { const d = pd(t.due), n = Math.round((d - t0) / 864e5); (n < 0 ? g['Overdue'] : n === 0 ? g['Today'] : n === 1 ? g['Tomorrow'] : n < 7 ? g['This week'] : g['Later']).push(t); }
  }
  let h = '<div class="fade">';
  for (const [k, arr] of Object.entries(g)) if (arr.length) h += `<div class="h ${k === 'Overdue' ? 'err' : ''}">${k} <b>${arr.length}</b></div>` + arr.map(taskRow).join('');
  if (!open.length) h += '<div class="empty" style="font-size:15px;padding-top:30px">All clear. Add a task above, or say “planner, add …”.</div>';
  if (S.showDone && done.length) h += `<div class="h">Completed <b>${done.length}</b></div>` + done.map(taskRow).join('');
  return h + '</div>';
}

function viewUpcoming() {
  const t0 = sod(new Date()); let h = '<div class="fade">', any = false;
  for (let i = 0; i < 21; i++) {
    const d = addDays(t0, i), evs = eventsOn(d), tk = openTasks().filter(t => t.due && (i === 0 ? pd(t.due) <= d : same(pd(t.due), d)));
    if (!evs.length && !tk.length) continue;
    any = true;
    h += `<div class="h">${dayWord(d)} <b>${DOW[d.getDay()]}, ${MON[d.getMonth()].slice(0, 3)} ${d.getDate()}</b></div>` + evs.map(e => evRow(e)).join('') + tk.map(taskRow).join('');
  }
  if (!any) h += '<div class="empty" style="font-size:15px;padding-top:30px">Nothing coming up in the next three weeks.</div>';
  return h + '</div>';
}

// ---------------------------------------------------------------- calendar
const HH = 48;
function viewCal() { return S.cal === 'month' ? calMonth() : calGrid(S.cal === 'week' ? 7 : 1); }

function calMonth() {
  const first = new Date(S.anchor.getFullYear(), S.anchor.getMonth(), 1), start = weekStart(first), t0 = sod(new Date());
  const rows = Math.ceil((mon0(first) + new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate()) / 7);
  let cells = '';
  for (let i = 0; i < rows * 7; i++) {
    const d = addDays(start, i), evs = eventsOn(d), tk = S.showTasks ? tasksOn(d).filter(t => !t.done || S.showDone) : [];
    const items = [...evs.map(e => `<span class="chipev" data-act="edit-ev" data-id="${e.id}" data-occ="${e.start}" style="--c:${e.color}" title="${esc(e.title)}">${e.allDay ? '' : `<span class="tt">${fmtT(evStart(e))}</span>`}${esc(e.title)}</span>`),
      ...tk.map(t => `<span class="chipev tk ${t.done ? 'done' : ''}" data-act="edit-task" data-id="${t.id}" style="--c:${t.color}" title="${esc(t.title)}">${esc(t.title)}</span>`)];
    const cap = 3;
    cells += `<div class="cell ${d.getMonth() !== first.getMonth() ? 'out' : ''} ${same(d, t0) ? 'today' : ''}" data-act="cellnew" data-d="${ymd(d)}"><span class="dn" data-act="goday" data-d="${ymd(d)}">${d.getDate()}</span>${items.slice(0, cap).join('')}${items.length > cap ? `<div class="more" data-act="goday" data-d="${ymd(d)}">+${items.length - cap} more</div>` : ''}</div>`;
  }
  return `<div class="cal fade"><div class="dow">${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(x => `<span>${x}</span>`).join('')}</div><div class="month" style="grid-template-rows:repeat(${rows},1fr)">${cells}</div></div>`;
}

function layout(items) {           // overlap lanes: [{s,e}] minutes -> col, n
  items.sort((a, b) => a.s - b.s || b.e - a.e);
  let cols = [], cluster = [], end = -1;
  const flush = () => { const n = Math.max(...cluster.map(c => c.col)) + 1; cluster.forEach(c => c.n = n); cluster = []; cols = []; };
  for (const it of items) {
    if (cluster.length && it.s >= end) { flush(); end = -1; }
    let c = 0; while (cols[c] !== undefined && cols[c] > it.s) c++;
    cols[c] = it.e; it.col = c; cluster.push(it); end = Math.max(end, it.e);
  }
  if (cluster.length) flush();
  return items;
}

function calGrid(n) {
  const days = [...Array(n)].map((_, i) => addDays(n === 7 ? weekStart(S.anchor) : S.anchor, i)), t0 = sod(new Date());
  const head = days.map(d => `<div class="c ${same(d, t0) ? 'today' : ''}" data-act="goday" data-d="${ymd(d)}"><div class="d">${DOW[d.getDay()].slice(0, 3)}</div><div class="n">${d.getDate()}</div></div>`).join('');
  const allday = days.map(d => `<div class="c" data-act="cellnew" data-d="${ymd(d)}" data-all="1">${eventsOn(d).filter(e => e.allDay).map(e => `<span class="chipev" data-act="edit-ev" data-id="${e.id}" data-occ="${e.start}" style="--c:${e.color}">${esc(e.title)}</span>`).join('')}${(S.showTasks ? tasksOn(d).filter(t => !t.done || S.showDone) : []).map(t => `<span class="chipev tk ${t.done ? 'done' : ''}" data-act="edit-task" data-id="${t.id}" style="--c:${t.color}">${esc(t.title)}</span>`).join('')}</div>`).join('');
  const cols = days.map((d, ci) => {
    const evs = eventsOn(d).filter(e => !e.allDay).map(e => {
      const s = Math.max(0, (evStart(e) - d) / 6e4), en = Math.min(1440, (evEnd(e) - d) / 6e4);
      return { s, e: en, ev: e };
    });
    const items = layout(evs);
    const blocks = items.map(it => {
      const e = it.ev, top = it.s / 60 * HH, h = Math.max(22, (it.e - it.s) / 60 * HH - 2), w = 100 / it.n;
      return `<div class="evb" data-act="edit-ev" data-id="${e.id}" data-occ="${e.start}" data-ci="${ci}" style="--c:${e.color};top:${top}px;height:${h}px;left:calc(${it.col * w}% + 2px);width:calc(${w}% - 5px)"><div class="tt">${esc(e.title)}</div>${h > 34 ? `<div class="ts">${fmtT(evStart(e))} – ${fmtT(evEnd(e))}</div>` : ''}<div class="rz" data-rz="1"></div></div>`;
    }).join('');
    const now = new Date(), nl = same(d, now) ? `<div class="nowl" style="top:${(now.getHours() * 60 + now.getMinutes()) / 60 * HH}px"></div>` : '';
    return `<div class="tg-col ${same(d, t0) ? 'today' : ''}" data-col="${ci}" data-d="${ymd(d)}">${blocks}${nl}</div>`;
  }).join('');
  const hours = [...Array(24)].map((_, h) => h === 0 ? '' : `<span style="top:${h * HH}px">${h % 12 || 12} ${h < 12 ? 'AM' : 'PM'}</span>`).join('');
  return `<div class="tg fade" style="--n:${n};--hh:${HH}px"><div class="tg-head"><div></div>${head}</div><div class="tg-allday"><div class="l">all day</div>${allday}</div>
    <div class="tg-scroll" id="tgs"><div class="tg-body"><div class="tg-hours">${hours}</div>${cols}</div></div></div>`;
}

function afterCal() {
  const sc = $('#tgs'); if (!sc) return;
  if (S.scrollTop == null) { const now = new Date(); S.scrollTop = Math.max(0, ((now.getHours() - 1.5) * HH)); if (!same(S.anchor, now) && S.cal === 'day') S.scrollTop = 7 * HH; }
  sc.scrollTop = S.scrollTop;
  sc.addEventListener('scroll', () => { S.scrollTop = sc.scrollTop; });
}

// drag to create / move / resize on the time grid
function snap(min, step = 15) { return Math.round(min / step) * step; }
document.addEventListener('pointerdown', e => {
  const col = e.target.closest('.tg-col'); if (!col || e.button !== 0) return;
  const colsEls = [...document.querySelectorAll('.tg-col')], body = col.parentElement;
  const evb = e.target.closest('.evb');
  const yOf = (ev) => { const r = body.getBoundingClientRect(); return ev.clientY - r.top; };
  const colAt = (ev) => { for (const c of colsEls) { const r = c.getBoundingClientRect(); if (ev.clientX >= r.left && ev.clientX < r.right) return c; } return col; };
  const x0 = e.clientX, y0 = e.clientY; let moved = false;
  if (evb) {
    const id = evb.dataset.id, occ = evb.dataset.occ;
    const ev = S.data.events.find(x => x.id === id && x.start === occ); if (!ev) return;
    const rz = !!e.target.closest('[data-rz]');
    const s0 = evStart(ev), e0 = evEnd(ev), dur = (e0 - s0) / 6e4, startTop = parseFloat(evb.style.top), grabOff = yOf(e) - startTop;
    let tgtCol = col, newS = s0, newE = e0;
    const move = ev2 => {
      if (!moved && Math.hypot(ev2.clientX - x0, ev2.clientY - y0) < 5) return;
      if (!moved) { moved = true; S.dragging = true; evb.classList.add('drag'); evb.setPointerCapture?.(ev2.pointerId); }
      if (rz) {
        const endMin = Math.max(snap((yOf(ev2)) / HH * 60), (s0.getHours() * 60 + s0.getMinutes()) + 15);
        const d0 = sod(s0); newS = s0; newE = new Date(d0.getTime() + endMin * 6e4);
        evb.style.height = Math.max(22, (endMin - (s0.getHours() * 60 + s0.getMinutes())) / 60 * HH - 2) + 'px';
      } else {
        tgtCol = colAt(ev2);
        let startMin = Math.min(1440 - 15, Math.max(0, snap((yOf(ev2) - grabOff) / HH * 60)));
        const d = pd(tgtCol.dataset.d);
        newS = new Date(d.getTime() + startMin * 6e4); newE = new Date(newS.getTime() + dur * 6e4);
        tgtCol.appendChild(evb); evb.style.top = startMin / 60 * HH + 'px'; evb.style.left = '2px'; evb.style.width = 'calc(100% - 5px)';
        const ts = evb.querySelector('.ts'); if (ts) ts.textContent = `${fmtT(newS)} – ${fmtT(newE)}`;
      }
    };
    const up = () => {
      document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up);
      if (!moved) return;
      S.dragging = false;
      post({ cmd: 'move', id, occ, start: iso(newS), end: iso(newE), series: !!ev.series });
      setTimeout(() => { if (!S.dragging) { renderView('force'); } }, 50);
      suppressClick = true; setTimeout(() => suppressClick = false, 80);
    };
    document.addEventListener('pointermove', move); document.addEventListener('pointerup', up);
    return;
  }
  // empty space: click or drag to create
  const startMin = snap(yOf(e) / HH * 60, 30), d = pd(col.dataset.d);
  let ghost = null, endMin = startMin + 60;
  const move = ev2 => {
    if (!moved && Math.hypot(ev2.clientX - x0, ev2.clientY - y0) < 5) return;
    moved = true; S.dragging = true;
    endMin = Math.max(startMin + 15, snap(yOf(ev2) / HH * 60, 15));
    if (!ghost) { ghost = document.createElement('div'); ghost.className = 'dgh'; col.appendChild(ghost); }
    ghost.style.top = startMin / 60 * HH + 'px'; ghost.style.height = (endMin - startMin) / 60 * HH + 'px';
    ghost.textContent = `${fmtT(new Date(d.getTime() + startMin * 6e4))} – ${fmtT(new Date(d.getTime() + endMin * 6e4))}`;
  };
  const up = () => {
    document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up);
    S.dragging = false; ghost?.remove();
    if (startMin >= 1440) return;
    newItem({ kind: 'event', date: ymd(d), st: hhmm(new Date(d.getTime() + startMin * 6e4)), et: hhmm(new Date(d.getTime() + Math.min(endMin, 1439) * 6e4)) });
  };
  document.addEventListener('pointermove', move); document.addEventListener('pointerup', up);
});
let suppressClick = false;

// ---------------------------------------------------------------- editor drawer
const DC = ['SU', 'MO', 'TU', 'WE', 'TH', 'FR', 'SA'];
const blankRep = () => ({ freq: '', interval: 1, days: [], end: 'never', until: '', count: 5, md: 0 });
function repFrom(rr) {
  const o = blankRep(); if (!rr) return o;
  rr.split(';').forEach(p => {
    const [k, v] = p.split('=');
    if (k === 'FREQ') o.freq = v; else if (k === 'INTERVAL') o.interval = +v || 1;
    else if (k === 'BYDAY') o.days = v.split(',').map(x => DC.indexOf(x)).filter(x => x >= 0);
    else if (k === 'BYMONTHDAY') o.md = +v || 0;
    else if (k === 'UNTIL') { o.end = 'date'; o.until = `${v.slice(0, 4)}-${v.slice(4, 6)}-${v.slice(6, 8)}`; }
    else if (k === 'COUNT') { o.end = 'count'; o.count = +v || 5; }
  });
  return o;
}
function repTo(r) {
  if (!r.freq) return null;
  let s = 'FREQ=' + r.freq;
  if (r.interval > 1) s += ';INTERVAL=' + r.interval;
  if (r.freq === 'WEEKLY' && r.days.length) s += ';BYDAY=' + [...r.days].sort((a, b) => ((a + 6) % 7) - ((b + 6) % 7)).map(i => DC[i]).join(',');
  if (r.freq === 'MONTHLY' && r.md) s += ';BYMONTHDAY=' + r.md;
  if (r.end === 'date' && r.until) s += ';UNTIL=' + r.until.replaceAll('-', '');
  if (r.end === 'count' && r.count > 0) s += ';COUNT=' + r.count;
  return s;
}
function presetOf(r) {
  if (!r.freq) return '';
  const wd = r.days.length === 5 && [1, 2, 3, 4, 5].every(x => r.days.includes(x));
  if (r.freq === 'DAILY' && r.interval === 1) return 'DAILY';
  if (r.freq === 'WEEKLY' && r.interval === 1 && wd) return 'WEEKDAYS';
  if (r.freq === 'WEEKLY' && r.interval === 1 && r.days.length <= 1) return 'WEEKLY';
  if (r.freq === 'WEEKLY' && r.interval === 2 && r.days.length <= 1) return 'BIWEEKLY';
  if (r.freq === 'MONTHLY' && r.interval === 1 && !r.md) return 'MONTHLY';
  if (r.freq === 'YEARLY' && r.interval === 1) return 'YEARLY';
  return 'CUSTOM';
}

function newItem(o = {}) {
  const now = new Date(), d0 = o.date || ymd(S.view === 'cal' ? S.anchor : now);
  const hr = new Date(now.getTime() + 36e5); hr.setMinutes(0, 0, 0);
  const kind = o.kind || (S.view === 'cal' ? 'event' : 'task');
  openEditor({
    id: null, kind, title: '', notes: '', cat: S.cat || '', prio: 0, date: o.date || (kind === 'task' ? '' : d0), allDay: !!o.allDay,
    st: o.st || hhmm(hr), et: o.et || hhmm(new Date(hr.getTime() + 36e5)), endDate: '', rep: blankRep(), alert: 10, series: false, occ: '', scope: 'all', ...o,
  });
}

function editItem(kind, id, occ) {
  if (kind === 'task') {
    const t = S.data.tasks.find(x => x.id === id); if (!t) return;
    openEditor({ id, kind: 'task', title: t.title, notes: t.notes, cat: t.cat, prio: t.prio, date: t.due || '', allDay: false, st: '09:00', et: '10:00', endDate: '', rep: repFrom(t.rrule), alert: 10, series: false, occ: '', scope: 'all' });
  } else {
    const e = S.data.events.find(x => x.id === id && (!occ || x.start === occ)) || S.data.events.find(x => x.id === id); if (!e) return;
    const s = evStart(e), en = evEnd(e);
    openEditor({ id, kind: 'event', title: e.title, notes: e.notes, cat: e.cat, prio: e.prio, allDay: e.allDay, date: ymd(s), st: hhmm(s), et: hhmm(en), endDate: e.allDay ? ymd(addDays(en, -1)) : (same(s, en) ? '' : ymd(en)),
      rep: repFrom(e.rrule), alert: e.alert, series: e.series, occ: e.start, scope: e.series ? 'all' : 'one', seriesStart: e.seriesStart });
  }
}

function openEditor(m) { S.editor = m; renderEditor(); $('#scrim').classList.add('on'); $('#drawer').classList.add('on'); setTimeout(() => $('#ed-title')?.focus(), 60); }
function closeEditor() { S.editor = null; $('#scrim').classList.remove('on'); $('#drawer').classList.remove('on'); }

function renderEditor() {
  const m = S.editor; if (!m) return;
  const cats = [...new Set([...S.data.cats.map(c => c.name), ...(m.cat ? [m.cat] : [])])];
  const ev = m.kind === 'event', preset = presetOf(m.rep), r = m.rep;
  const showDays = r.freq === 'WEEKLY' && (preset === 'CUSTOM' || preset === 'WEEKLY' || preset === 'BIWEEKLY' || preset === 'WEEKDAYS');
  const opt = (v, l, cur) => `<option value="${v}" ${String(cur) === String(v) ? 'selected' : ''}>${l}</option>`;
  $('#drawer').innerHTML = `
  <div class="dh"><div class="seg">${m.id ? '' : ['task', 'event'].map(k => `<button data-act="ed-kind" data-v="${k}" class="${m.kind === k ? 'on' : ''}">${k === 'task' ? 'Task' : 'Event'}</button>`).join('')}${m.id ? `<button class="on" style="cursor:default">${ev ? 'Event' : 'Task'}</button>` : ''}</div><span class="sp"></span><button class="icon" data-act="ed-close" title="Close (Esc)">${ICON.x}</button></div>
  <div class="db">

    ${ev ? `<div class="fld"><label>All day</label><div class="v"><button class="sw ${m.allDay ? 'on' : ''}" data-act="ed-allday" aria-label="All day"></button></div></div>
    ${m.allDay ? `<div class="fld"><label>Until</label><div class="v"><input class="inp" type="date" id="ed-enddate" value="${m.endDate || m.date}"><span class="note" style="padding:0">last day</span></div></div>`
      : `<div class="fld"><label>Time</label><div class="v"><input class="inp" type="time" id="ed-st" value="${m.st}"><span style="color:var(--faint)">to</span><input class="inp" type="time" id="ed-et" value="${m.et}"></div></div>`}` : ''}
    <div class="fld"><label>Repeat</label><div class="v"><select class="inp" id="ed-rep">${[['', 'Does not repeat'], ['DAILY', 'Every day'], ['WEEKDAYS', 'Every weekday'], ['WEEKLY', 'Every week'], ['BIWEEKLY', 'Every 2 weeks'], ['MONTHLY', 'Every month'], ['YEARLY', 'Every year'], ['CUSTOM', 'Custom…']].map(([v, l]) => opt(v, l, preset)).join('')}</select></div></div>
    ${preset === 'CUSTOM' ? `<div class="fld"><label>Every</label><div class="v"><input class="inp" type="number" min="1" max="99" id="ed-int" value="${r.interval}"><select class="inp" id="ed-freq">${[['DAILY', 'days'], ['WEEKLY', 'weeks'], ['MONTHLY', 'months'], ['YEARLY', 'years']].map(([v, l]) => opt(v, l, r.freq)).join('')}</select></div></div>` : ''}
    ${showDays ? `<div class="fld"><label>On</label><div class="v days">${[1, 2, 3, 4, 5, 6, 0].map(i => `<button data-act="ed-day" data-v="${i}" class="${r.days.includes(i) ? 'on' : ''}">${'SMTWTFS'[i]}</button>`).join('')}</div></div>` : ''}
    ${r.freq ? `<div class="fld"><label>Ends</label><div class="v"><select class="inp" id="ed-end">${[['never', 'Never'], ['date', 'On a date'], ['count', 'After a number']].map(([v, l]) => opt(v, l, r.end)).join('')}</select>
      ${r.end === 'date' ? `<input class="inp" type="date" id="ed-until" value="${r.until}">` : ''}${r.end === 'count' ? `<input class="inp" type="number" min="1" id="ed-count" value="${r.count}"><span style="color:var(--faint)">times</span>` : ''}</div></div>` : ''}

    <div class="fld"><label>List</label><div class="v"><select class="inp" id="ed-cat">${opt('', 'None', m.cat)}${cats.map(c => opt(esc(c), esc(c), m.cat)).join('')}${opt('__new', 'New list…', '')}</select></div></div>

function pullEditor() {                 // read the form back into the model
  const m = S.editor; if (!m) return;
  const g = id => document.getElementById(id);
  if (g('ed-title')) m.title = g('ed-title').value;
  if (g('ed-notes')) m.notes = g('ed-notes').value;
  if (g('ed-date')) m.date = g('ed-date').value;
  if (g('ed-st')) m.st = g('ed-st').value;
  if (g('ed-et')) m.et = g('ed-et').value;
  if (g('ed-enddate')) m.endDate = g('ed-enddate').value;
  if (g('ed-alert')) m.alert = +g('ed-alert').value;
  if (g('ed-int')) m.rep.interval = Math.max(1, +g('ed-int').value || 1);
  if (g('ed-until')) m.rep.until = g('ed-until').value;
  if (g('ed-count')) m.rep.count = Math.max(1, +g('ed-count').value || 1);
}

function wireEditor() {
  const m = S.editor, g = id => document.getElementById(id);
  g('ed-title')?.addEventListener('keydown', e => { if (e.key === 'Enter') saveEditor(); });
  g('ed-rep')?.addEventListener('change', e => {
    pullEditor(); const v = e.target.value, r = m.rep, dow = m.date ? pd(m.date).getDay() : new Date().getDay(); r.end = 'never';
    if (v === '') Object.assign(r, blankRep());
    else if (v === 'DAILY') Object.assign(r, { freq: 'DAILY', interval: 1, days: [], md: 0 });
    else if (v === 'WEEKDAYS') Object.assign(r, { freq: 'WEEKLY', interval: 1, days: [1, 2, 3, 4, 5], md: 0 });
    else if (v === 'WEEKLY') Object.assign(r, { freq: 'WEEKLY', interval: 1, days: [dow], md: 0 });
    else if (v === 'BIWEEKLY') Object.assign(r, { freq: 'WEEKLY', interval: 2, days: [dow], md: 0 });
    else if (v === 'MONTHLY') Object.assign(r, { freq: 'MONTHLY', interval: 1, days: [], md: 0 });
    else if (v === 'YEARLY') Object.assign(r, { freq: 'YEARLY', interval: 1, days: [], md: 0 });
    else if (v === 'CUSTOM') { if (!r.freq) Object.assign(r, { freq: 'WEEKLY', interval: 3, days: [dow] }); else r.interval = Math.max(r.interval, 3); }
    if (!m.date && v && m.kind === 'task') m.date = ymd(new Date());
    renderEditor();
  });
  g('ed-freq')?.addEventListener('change', e => { pullEditor(); m.rep.freq = e.target.value; if (m.rep.freq === 'WEEKLY' && !m.rep.days.length) m.rep.days = [pd(m.date || ymd(new Date())).getDay()]; renderEditor(); });
  g('ed-end')?.addEventListener('change', e => { pullEditor(); m.rep.end = e.target.value; renderEditor(); });
  g('ed-cat')?.addEventListener('change', e => {
    pullEditor();
    if (e.target.value === '__new') { const n = prompt('Name of the new list'); m.cat = n ? n.trim() : m.cat; } else m.cat = e.target.value;
    renderEditor();
  });
}

function saveEditor() {
  pullEditor(); const m = S.editor; if (!m) return;
  if (!m.title.trim()) { toast('Give it a title', true); $('#ed-title')?.focus(); return; }
  const ev = m.kind === 'event';
  if (ev && !m.date) { toast('Pick a date', true); return; }
  if (ev && !m.allDay && m.st && m.et && m.et <= m.st && !m.endDate) m.endDate = ymd(addDays(pd(m.date), 1));
  const out = {
    cmd: 'save', id: m.id, kind: m.kind, title: m.title.trim(), notes: m.notes, cat: m.cat, prio: m.prio, rrule: repTo(m.rep), scope: m.scope, occ: m.occ,
    date: m.date, allDay: m.allDay, start: ev && !m.allDay ? `${m.date}T${m.st}:00` : null, end: ev && !m.allDay ? `${m.endDate || m.date}T${m.et}:00` : null,
    endDate: ev && m.allDay ? (m.endDate || m.date) : null, alert: m.alert,
  };
  post(out); closeEditor();
}

// ---------------------------------------------------------------- events
let toastTimer = 0;
function toast(text, err) { const t = $('#toast'); t.textContent = text; t.classList.toggle('err', !!err); t.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2600); }

document.addEventListener('click', e => {
  if (suppressClick) return;
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, v = el.dataset.v, id = el.dataset.id;
  const stop = () => { e.stopPropagation(); e.preventDefault(); };
  switch (a) {
    case 'nav': S.cat = null; go(v); break;
    case 'cat': S.cat = v; go('tasks'); break;
    case 'new': newItem(); break;
    case 'prev': case 'next': { const k = a === 'next' ? 1 : -1; if (S.cal === 'month') S.anchor = new Date(S.anchor.getFullYear(), S.anchor.getMonth() + k, 1); else S.anchor = addDays(S.anchor, k * (S.cal === 'week' ? 7 : 1)); requestRange(); renderTop(); renderView(); break; }
    case 'today': S.anchor = sod(new Date()); requestRange(); renderTop(); renderView(); break;
    case 'cal': S.cal = v; requestRange(); renderTop(); renderView(); break;
    case 'tasktoggle': S.showTasks = !S.showTasks; renderTop(); renderView(); break;
    case 'donetoggle': S.showDone = !S.showDone; renderTop(); renderView(); break;
    case 'kind': S.kind = v; renderQA2(); break;
    case 'goday': stop(); S.anchor = pd(el.dataset.d); S.view = 'cal'; S.cal = 'day'; S.cat = null; requestRange(true); renderChrome(); renderView(); break;
    case 'cellnew': if (e.target.closest('.chipev,.more,.dn')) return; if (el.dataset.all) newItem({ kind: 'event', date: el.dataset.d, allDay: true }); else newItem({ kind: 'event', date: el.dataset.d, st: '09:00', et: '10:00' }); break;
    case 'toggle': stop(); post({ cmd: 'toggle', id }); break;
    case 'del-task': stop(); post({ cmd: 'delete', id, scope: 'all' }); break;
    case 'edit-task': editItem('task', id); break;
    case 'edit-ev': stop(); editItem('event', id, el.dataset.occ); break;
    case 'sync': post({ cmd: 'sync' }); break;
    case 'connect': post({ cmd: 'connect' }); break;
    case 'disconnect': post({ cmd: 'disconnect' }); break;
    case 'ed-close': closeEditor(); break;
    case 'ed-save': saveEditor(); break;
    case 'ed-kind': pullEditor(); S.editor.kind = v; if (v === 'event' && !S.editor.date) S.editor.date = ymd(S.view === 'cal' ? S.anchor : new Date()); renderEditor(); break;
    case 'ed-allday': pullEditor(); S.editor.allDay = !S.editor.allDay; renderEditor(); break;
    case 'ed-clear-date': pullEditor(); S.editor.date = ''; S.editor.rep = blankRep(); renderEditor(); break;
    case 'ed-prio': pullEditor(); S.editor.prio = +v; renderEditor(); break;
    case 'ed-scope': pullEditor(); S.editor.scope = v; renderEditor(); break;
    case 'ed-day': { pullEditor(); const r = S.editor.rep, i = +v; r.days = r.days.includes(i) ? r.days.filter(x => x !== i) : [...r.days, i]; if (!r.days.length) r.days = [i]; renderEditor(); break; }
    case 'ed-delete': {
      const m = S.editor;
      if (m.series && m.scope === 'one') post({ cmd: 'delete', id: m.id, scope: 'one', occ: m.occ });
      else post({ cmd: 'delete', id: m.id, scope: 'all' });
      closeEditor(); break;
    }
  }
});
function renderQA2() { document.querySelectorAll('.qbox .seg button').forEach(b => b.classList.toggle('on', b.dataset.v === S.kind)); const i = $('#qin'); if (i && i.value.trim()) post({ cmd: 'parse', text: i.value, kind: S.kind }); i?.focus(); }
$('#scrim').addEventListener('click', closeEditor);

document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || '');
  if (e.key === 'Escape') { if (S.editor) closeEditor(); return; }
  if (S.editor && (e.ctrlKey || e.metaKey) && e.key === 'Enter') { saveEditor(); return; }
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'n') { e.preventDefault(); newItem(); }
  else if (k === '/' || k === 'a') { e.preventDefault(); $('#qin')?.focus(); }
  else if (k === 't') { S.anchor = sod(new Date()); go(S.view === 'cal' ? 'calendar' : 'today'); }
  else if (k === '1') go('today'); else if (k === '2') go('calendar'); else if (k === '3') go('tasks'); else if (k === '4') go('upcoming');
  else if (S.view === 'cal' && k === 'd') { S.cal = 'day'; requestRange(); renderTop(); renderView(); }
  else if (S.view === 'cal' && k === 'w') { S.cal = 'week'; requestRange(); renderTop(); renderView(); }
  else if (S.view === 'cal' && k === 'm') { S.cal = 'month'; requestRange(); renderTop(); renderView(); }
  else if (S.view === 'cal' && (k === 'arrowleft' || k === 'arrowright')) document.querySelector(`[data-act="${k === 'arrowleft' ? 'prev' : 'next'}"]`)?.click();
});

// keep "now" lines and the greeting fresh
setInterval(() => { if (!S.dragging && (S.view === 'today' || S.view === 'cal')) renderView(true); }, 60000);   // clock markers; quiet = no flash

// ---------------------------------------------------------------- boot
renderChrome(); renderView();
post({ cmd: 'ready' }); requestRange(true);

// ---------------------------------------------------------------- browser mock (only when not hosted): sample data for design work
function mockPost(o) {
  if (o.cmd === 'range' || o.cmd === 'ready') { setTimeout(() => onMsg(mockState()), 0); }
  if (o.cmd === 'parse') setTimeout(() => onMsg({ type: 'parsed', kind: /\d(am|pm)/.test(o.text) ? 'event' : 'task', title: o.text.replace(/#\w+/, '').trim(), when: 'Fri 3 PM–4 PM', repeat: /every/.test(o.text) ? 'Every 2 weeks' : '', cat: /#(\w+)/.test(o.text) ? RegExp.$1 : '', color: '#8fe0cc', prio: /!/.test(o.text) ? 3 : 0 }), 0);
}
function mockState() {
  const t = sod(new Date()), at = (d, h, m = 0) => iso(new Date(t.getFullYear(), t.getMonth(), t.getDate() + d, h, m));
  const ev = (id, title, d, h, m, dur, color, cat, rep) => ({ id, title, notes: '', start: at(d, h, m), end: at(d, h, m + dur), allDay: false, cat, color, prio: 0, alert: 10, series: !!rep, rrule: rep ? 'FREQ=WEEKLY' : null, repeat: rep, seriesStart: at(d, h, m), synced: true });
  const events = [ev('e1', 'Digital design lecture', 0, 9, 0, 75, '#8fe0cc', 'School', 'Every Mon, Wed'), ev('e2', 'Lunch with Sam', 0, 12, 30, 60, '#f3c98b', 'Personal'), ev('e3', 'Study group', 0, 16, 0, 120, '#8fe0cc', 'School'), ev('e4', 'Dentist', 1, 15, 0, 60, '#ffb4a8', 'Health', 'Every 6 months'), ev('e5', 'Standup', 2, 9, 30, 15, '#a9d8ff', '', 'Every weekday'), ev('e6', 'Gym', 3, 18, 0, 60, '#c2d68a', 'Health', 'Every Mon, Wed, Fri'),
    { id: 'e7', title: 'Hackathon', notes: '', start: at(4, 0), end: at(6, 0), allDay: true, cat: 'School', color: '#8fe0cc', prio: 0, alert: 10, series: false, rrule: null, repeat: null, seriesStart: at(4, 0), synced: true }];
  const tk = (id, title, d, cat, color, prio, repeat, done) => ({ id, title, notes: '', due: d == null ? null : ymd(addDays(t, d)), done: !!done, cat, color, prio, rrule: repeat ? 'FREQ=WEEKLY' : null, repeat, synced: true });
  const tasks = [tk('t1', 'Lab report: op-amp circuits', -1, 'School', '#8fe0cc', 3), tk('t2', 'Email Prof. Lee about the extension', 0, 'School', '#8fe0cc', 2), tk('t3', 'Water the plants', 0, '', '#a9d8ff', 0, 'Every week'), tk('t4', 'Pay rent', 2, 'Personal', '#f3c98b', 3, 'Every month'), tk('t5', 'Read chapter 7', 3, 'School', '#8fe0cc', 1), tk('t6', 'Renew passport', null, 'Personal', '#f3c98b', 0), tk('t7', 'Buy milk', 0, 'Personal', '#f3c98b', 0, null, true)];
  return { type: 'state', now: iso(new Date()), cats: [{ name: 'Health', color: '#c2d68a', open: 0 }, { name: 'Personal', color: '#f3c98b', open: 2 }, { name: 'School', color: '#8fe0cc', open: 3 }], tasks, events, google: { connected: true, hasClient: true, status: 'Synced 9:41 PM' } };
}
